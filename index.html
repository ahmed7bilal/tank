<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة التانكي</title>
<style>
body{margin:0;background:#0b1b2b;color:#fff;font-family:Arial}
.box{max-width:430px;margin:20px auto;padding:20px;background:#13263a;border-radius:16px;box-shadow:0 0 20px #0006}
h2{text-align:center;color:#52d1ff}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;font-size:18px}
input{background:#eef3f7}
button{background:#00b050;color:#fff;font-weight:bold}
.tank{height:60px;border:3px solid #ddd;border-radius:40px;overflow:hidden;margin:15px 0}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#00c6ff,#0072ff);transition:.6s}
#res{font-size:20px;text-align:center;line-height:1.8}
</style></head>
<body><div class="box">
<h2>🛢️ حاسبة التانكي الأفقي</h2>
<input id="L" placeholder="الطول (سم)" type="number">
<input id="D" placeholder="العرض/القطر (سم)" type="number">
<input id="H" placeholder="الارتفاع (سم)" type="number">
<input id="LV" placeholder="ارتفاع السائل (سم)" type="number">
<button onclick="calc()">احسب</button>
<div class="tank"><div class="fill" id="fill"></div></div>
<div id="res">أدخل البيانات ثم اضغط احسب</div>
</div>
<script>
function calc(){
let L=+document.getElementById('L').value/100;
let D=((+document.getElementById('D').value)+(+document.getElementById('H').value))/2/100;
let h=+document.getElementById('LV').value/100;
if(!(L>0&&D>0)){res.innerHTML="يرجى إدخال جميع القيم";return;}
if(h<0)h=0;if(h>D)h=D;
let r=D/2;
let area=r*r*Math.acos((r-h)/r)-(r-h)*Math.sqrt(Math.max(0,2*r*h-h*h));
let liters=area*L*1000;
let total=Math.PI*r*r*L*1000;
let p=liters/total*100;
document.getElementById("fill").style.width=p+"%";
document.getElementById("res").innerHTML="<b>"+liters.toFixed(1)+" لتر</b><br>السعة: "+total.toFixed(1)+" لتر<br>الامتلاء: "+p.toFixed(1)+"%";
}
</script></body></html>
