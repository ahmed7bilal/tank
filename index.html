<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة التانكي</title>
<style>body{font-family:Arial;background:#f4f4f4;max-width:420px;margin:auto;padding:20px}input,button{width:100%;padding:10px;margin:6px 0}#r{background:#fff;padding:10px;border-radius:8px}</style>
</head><body><h2>حاسبة تانكي أفقي</h2>
<input id=l placeholder="الطول سم" type=number>
<input id=w placeholder="العرض/القطر سم" type=number>
<input id=h placeholder="الارتفاع سم" type=number>
<input id=x placeholder="ارتفاع السائل سم" type=number>
<button onclick="c()">احسب</button><div id=r></div>
<script>
function c(){
let L=+l.value/100,D=((+w.value)+(+h.value))/2/100,lev=+x.value/100,r=D/2;
if(!L||!D){r.innerHTML='أدخل القيم';return;}
lev=Math.max(0,Math.min(lev,D));
let A=r*r*Math.acos((r-lev)/r)-(r-lev)*Math.sqrt(2*r*lev-lev*lev);
let liters=A*L*1000,total=Math.PI*r*r*L*1000;
document.getElementById('r').innerHTML='الكمية: <b>'+liters.toFixed(1)+' لتر</b><br>السعة: '+total.toFixed(1)+' لتر<br>الامتلاء: '+(liters/total*100).toFixed(1)+'%';
}
</script></body></html>
